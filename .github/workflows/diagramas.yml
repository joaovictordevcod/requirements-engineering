name: Diagramas

on:
  push:
    branches: [main]
    paths: ["modelos/**", "scripts/render-diagramas.sh", ".github/workflows/diagramas.yml"]
  pull_request:
    paths: ["modelos/**", "scripts/render-diagramas.sh", ".github/workflows/diagramas.yml"]
  workflow_dispatch:

jobs:
  renderizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar Graphviz e fontes
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-liberation

      - name: Renderizar diagramas
        run: bash scripts/render-diagramas.sh

      - name: Publicar imagens
        uses: actions/upload-artifact@v4
        with:
          name: diagramas
          path: build/diagramas/
          if-no-files-found: ignore
          retention-days: 30
